<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unión Deportiva - Inscripción a Torneos y Fixture</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #1d2a44;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        /* Logo & Header */
        .logo-container {
            margin-bottom: 20px;
        }

        h1 {
            color: #0f1e36;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            background: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .card-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 1.1rem;
            color: #0f1e36;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #0f1e36;
        }

        .price-sub {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .btn-select {
            background-color: #0f1e36;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-select:hover {
            background-color: #1d3557;
        }

        /* SECCIÓN FIXTURE */
        .fixture-section {
            margin: 40px 0;
            text-align: left;
        }

        .fixture-section h2 {
            font-size: 1.5rem;
            color: #0f1e36;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 2px solid #0f1e36;
            padding-bottom: 5px;
        }

        .fixture-table-container {
            overflow-x: auto;
        }

        .fixture-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .fixture-table th, .fixture-table td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }

        .fixture-table th {
            background-color: #0f1e36;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .fixture-table tr:hover {
            background-color: #f1f5f9;
        }

        .vs-badge {
            background-color: #d4af37;
            color: #ffffff;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        /* Formulario */
        .form-section {
            max-width: 500px;
            margin: 40px auto 0 auto;
            text-align: left;
            background: #f1f5f9;
            padding: 25px;
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #334155;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-submit {
            background-color: #0f1e36;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1d3557;
        }

        /* Stepper bar */
        .stepper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
        }

        .stepper .active {
            color: #0f1e36;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #64748b;
        }

        footer a {
            color: #64748b;
            text-decoration: none;
            margin-right: 15px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Encabezado con título/logo -->
    <div class="logo-container">
        <h2 style="letter-spacing: 2px; color: #0f1e36;">UNIÓN DEPORTIVA</h2>
        <small style="color: #d4af37; font-weight: bold; letter-spacing: 1px;">ESPÍRITU DE EQUIPO, PASIÓN DE JUEGO</small>
    </div>

    <h1>Inscripción Abierta a Torneos</h1>

    <!-- Tarjetas de deportes -->
    <div class="cards-grid">
        <!-- Fútbol -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=400" alt="Fútbol" class="card-img">
            <h3>Torneo de Fútbol</h3>
            <div class="price">80.000 ARS</div>
            <div class="price-sub">por equipo</div>
            <button class="btn-select" onclick="seleccionarDeporte('Torneo de Fútbol')">Inscribir equipo</button>
        </div>

        <!-- Básquet -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=400" alt="Básquet" class="card-img">
            <h3>Torneo de Básquet</h3>
            <div class="price">50.000 ARS</div>
            <div class="price-sub">por equipo</div>
