<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unión Deportiva - Inscripción a Torneos y Fixture</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #1d2a44;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        /* Logo & Header */
        .logo-container {
            margin-bottom: 20px;
        }

        h1 {
            color: #0f1e36;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            background: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .card-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 1.1rem;
            color: #0f1e36;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #0f1e36;
        }

        .price-sub {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .btn-select {
            background-color: #0f1e36;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-select:hover {
            background-color: #1d3557;
        }
